<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="todo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <filter id="todo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f766e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#todo-bg)" />

  <!-- Notepad Card & Checkmark -->
  <g filter="url(#todo-shadow)">
    <!-- White Card Base -->
    <rect x="120" y="100" width="272" height="320" rx="32" fill="#FFFFFF" />
    <!-- Lines -->
    <rect x="220" y="170" width="130" height="16" rx="8" fill="#E2E8F0" />
    <rect x="220" y="248" width="130" height="16" rx="8" fill="#E2E8F0" />
    <rect x="220" y="326" width="90" height="16" rx="8" fill="#E2E8F0" />
    
    <!-- Circle Checkboxes -->
    <circle cx="170" cy="178" r="22" fill="#10B981" />
    <path d="M162,178 L168,184 L179,173" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <circle cx="170" cy="256" r="22" fill="#10B981" />
    <path d="M162,256 L168,262 L179,251" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <circle cx="170" cy="334" r="20" fill="none" stroke="#CBD5E1" stroke-width="4" />
  </g>
</svg>
