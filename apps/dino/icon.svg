<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="dinoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#dinoBg)"/>
  
  <!-- 经典的复古像素小恐龙造型 (无损纯矢量) -->
  <g fill="#f3f4f6" transform="translate(106, 96) scale(7)">
    <!-- 头部与眼睛 -->
    <rect x="22" y="0" width="16" height="4"/>
    <rect x="20" y="4" width="20" height="8"/>
    <!-- 眼睛挖空 -->
    <rect x="24" y="6" width="3" height="3" fill="#1f2937"/>
    <!-- 嘴部 -->
    <rect x="20" y="12" width="22" height="4"/>
    <rect x="20" y="16" width="14" height="2"/>
    <rect x="30" y="14" width="12" height="2"/>
    
    <!-- 脖子与身体 -->
    <rect x="18" y="18" width="10" height="4"/>
    <rect x="14" y="22" width="16" height="4"/>
    <rect x="12" y="26" width="18" height="6"/>
    <!-- 小前爪 -->
    <rect x="28" y="28" width="4" height="2"/>
    <rect x="30" y="30" width="2" height="2"/>

    <!-- 尾巴与下腹 -->
    <rect x="8" y="22" width="6" height="4"/>
    <rect x="4" y="24" width="4" height="4"/>
    <rect x="0" y="26" width="4" height="4"/>
    <rect x="10" y="32" width="18" height="6"/>

    <!-- 左腿 -->
    <rect x="14" y="38" width="4" height="4"/>
    <rect x="14" y="42" width="6" height="2"/>

    <!-- 右腿 -->
    <rect x="22" y="38" width="4" height="5"/>
    <rect x="22" y="43" width="6" height="2"/>
  </g>

  <!-- 地面虚线与小仙人掌点缀 -->
  <g fill="#9ca3af">
    <rect x="60" y="430" width="120" height="6" rx="3"/>
    <rect x="210" y="430" width="80" height="6" rx="3"/>
    <rect x="320" y="430" width="140" height="6" rx="3"/>
  </g>
</svg>
