<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pomo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="pomo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#991B1B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#pomo-bg)" />

  <!-- Tomato Body & Clock face -->
  <g filter="url(#pomo-shadow)" transform="translate(256, 275)">
    <!-- Main circle -->
    <circle cx="0" cy="0" r="140" fill="#FEE2E2" />
    <!-- Clock ticks -->
    <circle cx="0" cy="-110" r="6" fill="#DC2626" />
    <circle cx="110" cy="0" r="6" fill="#DC2626" />
    <circle cx="0" cy="110" r="6" fill="#DC2626" />
    <circle cx="-110" cy="0" r="6" fill="#DC2626" />
    
    <!-- Clock Hands (25 mins) -->
    <line x1="0" y1="0" x2="0" y2="-75" stroke="#DC2626" stroke-width="12" stroke-linecap="round" />
    <line x1="0" y1="0" x2="55" y2="40" stroke="#DC2626" stroke-width="8" stroke-linecap="round" />
    <circle cx="0" cy="0" r="12" fill="#DC2626" />
  </g>

  <!-- Leaf on top -->
  <path d="M256,115 C280,75 330,85 345,100 C345,130 305,145 256,135 Z" fill="url(#leaf)" />
  <path d="M256,115 C232,75 182,85 167,100 C167,130 207,145 256,135 Z" fill="url(#leaf)" />
  <rect x="250" y="95" width="12" height="30" rx="6" fill="#047857" />
</svg>
